[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

# 依存はワークspace 側で一元管理する。
# 各クレートは `foo.workspace = true` で参照し、バージョンの分岐を防ぐ。
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rayon = "1"
camino = "1"
regex = "1"

# dev
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"

# lint はワークスペースで定義し、各クレートが [lints] workspace = true で継承する。
# 学習環境なので pedantic まで入れて「なぜ怒られるか」を読む機会を増やす。
[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# 実務で邪魔になりがちなものは明示的に外す（外した理由を残すのが重要）。
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# ライブラリコードでの panic 系は落とす。テストは clippy.toml で許可済み。
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# ベンチ・プロファイル用。release と同等の最適化 + デバッグ情報。
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
