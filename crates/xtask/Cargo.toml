[package]
name = "xtask"
version = "0.0.0"
description = "配布物に同梱するシェル補完と man ページを生成する"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# **ここが `clap_complete` / `clap_mangen` の唯一の置き場所。**
# `tally` の依存にすると、集計しかしない利用者のビルドにも乗る
# （ADR-0009 論点 2）。`cargo tree -p tally` に出ないことを検査する。
[dependencies]
# **`Cli` の定義を見るためだけに依存している。** 逆向きは禁じる
# （`tally` は xtask を知らない）。規則は scripts/check-module-deps.sh。
tally = { path = "../tally", version = "0.1.0-rc.2" }

clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
